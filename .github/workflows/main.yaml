name: Build AdaptixC2

on:
  push:
    branches: [ testing-v2.0 ]
  pull_request:
    branches: [ testing-v2.0 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==================== Linux (只构建 Server + Extenders) ====================
  build-linux:
    name: Build Linux Server + Extenders
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Server + Extenders
        run: make docker-build-server-ext

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: adaptix-linux-server
          path: AdaptixServer/server-dist/
          retention-days: 5

  # ==================== Windows Client ====================
  build-windows-client:
    name: Build Windows Client
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache MSYS2
        uses: actions/cache@v4
        with:
          path: C:/msys64
          key: msys2-mingw64-qt6-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            msys2-mingw64-qt6-

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6
            mingw-w64-x86_64-qt6-tools

      - name: Build Client
        shell: msys2 {0}
        working-directory: AdaptixClient
        run: |
          export PATH="/mingw64/bin:$PATH"
          
          echo "[1/4] Build Release..."
          cmake -S . -B cmake-build-release -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build cmake-build-release --config Release
          
          echo "[2/4] Create dist..."
          rm -rf dist
          mkdir -p dist
          cp cmake-build-release/AdaptixClient.exe dist/
          
          echo "[3/4] windeployqt..."
          cd dist
          windeployqt.exe AdaptixClient.exe
          
          echo "[4/4] Add extra DLLs..."
          # 基础运行时
          cp /mingw64/bin/libwinpthread-1.dll . || true
          cp /mingw64/bin/libgcc_s_seh-1.dll . || true
          cp /mingw64/bin/libstdc++-6.dll . || true

          # 图形 / 字体
          cp /mingw64/bin/libfreetype-6.dll . || true
          cp /mingw64/bin/libharfbuzz-0.dll . || true
          cp /mingw64/bin/libpng16-16.dll . || true
          cp /mingw64/bin/zlib1.dll . || true

          # Brotli（解决 libbrotlidec.dll 缺失）
          cp /mingw64/bin/libbrotlidec.dll . || true
          cp /mingw64/bin/libbrotlicommon.dll . || true
          cp /mingw64/bin/libbrotlienc.dll . || true

          # 其他常见依赖
          cp /mingw64/bin/libpcre2-16-0.dll . || true
          cp /mingw64/bin/libpcre2-8-0.dll . || true
          cp /mingw64/bin/libintl-8.dll . || true
          cp /mingw64/bin/libiconv-2.dll . || true
          cp /mingw64/bin/libdouble-conversion.dll . || true
          cp /mingw64/bin/libmd4c.dll . || true
          cp /mingw64/bin/libb2-1.dll . || true

          # ICU
          cp /mingw64/bin/libicuin*.dll . || true
          cp /mingw64/bin/libicuuc*.dll . || true
          cp /mingw64/bin/libicudt*.dll . || true
          
          echo "[OK] Complete!"
          ls -la

      - name: Upload Windows Client
        uses: actions/upload-artifact@v4
        with:
          name: adaptix-client-windows
          path: AdaptixClient/dist/
          retention-days: 5

  # ==================== macOS Client ====================
  build-macos-client:
    name: Build macOS Client (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Cellar
            /opt/homebrew/Cellar
            /opt/homebrew/opt
            /usr/local/opt
          key: homebrew-qt6-official-${{ matrix.arch }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            homebrew-qt6-official-${{ matrix.arch }}-

      - name: Install dependencies (官方方式)
        run: |
          brew update
          
          # 先检查并卸载可能存在的冲突包
          for pkg in qt@6 qtbase qtdeclarative qtsvg qtwebsockets qttools qt; do
            if brew list --versions $pkg &>/dev/null; then
              echo "Uninstalling $pkg ..."
              brew uninstall --ignore-dependencies $pkg || true
            fi
          done
          
          # 按官方文档安装
          brew install make cmake openssl qt@6
          
          # 验证安装结果
          echo "=== Qt@6 安装路径 ==="
          brew --prefix qt@6
          ls "$(brew --prefix qt@6)/lib/cmake/Qt6/" || true

      - name: Build Client
        run: |
          export PATH="$(brew --prefix qt@6)/bin:$PATH"
          export CMAKE_PREFIX_PATH="$(brew --prefix qt@6)"
          
          echo "CMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH"
          which qmake
          qmake --version || true
          
          make client-fast
          
          mkdir -p dist-macos-${{ matrix.arch }}
          cp -r dist/* dist-macos-${{ matrix.arch }}/ 2>/dev/null || true
          cp -r AdaptixClient/AdaptixClient.app dist-macos-${{ matrix.arch }}/ 2>/dev/null || true
          ls -la dist-macos-${{ matrix.arch }}/

      - name: Upload macOS Client
        uses: actions/upload-artifact@v4
        with:
          name: adaptix-client-macos-${{ matrix.arch }}
          path: dist-macos-${{ matrix.arch }}/
          retention-days: 5

  # ==================== 自动创建 Release ====================
  release:
    name: Create Release
    needs: [build-linux, build-windows-client, build-macos-client]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/testing-v2.0' && github.event_name == 'push')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package files
        run: |
          mkdir -p release

          if [ -d artifacts/adaptix-linux-server ]; then
            (cd artifacts/adaptix-linux-server && zip -r ../../release/AdaptixC2-Linux-Server.zip .)
          fi

          if [ -d artifacts/adaptix-client-windows ]; then
            (cd artifacts/adaptix-client-windows && zip -r ../../release/AdaptixClient-Windows.zip .)
          fi

          if [ -d artifacts/adaptix-client-macos-arm64 ]; then
            (cd artifacts/adaptix-client-macos-arm64 && zip -r ../../release/AdaptixClient-macOS-arm64.zip .)
          fi

          if [ -d artifacts/adaptix-client-macos-x86_64 ]; then
            (cd artifacts/adaptix-client-macos-x86_64 && zip -r ../../release/AdaptixClient-macOS-x86_64.zip .)
          fi

          ls -lh release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AdaptixC2 Build #${{ github.run_number }} (testing-v2.0)
          body: |
            构建分支: `testing-v2.0`
            
            包含内容：
            - **Linux**: Server + Extenders
            - **Windows**: Client（已包含 Brotli 等依赖）
            - **macOS**: Client (ARM64 + x86_64)
          files: release/*.zip
          draft: false
          prerelease: true
