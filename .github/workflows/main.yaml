name: Build AdaptixC2

on:
  push:
    branches: [ testing-v2.0 ]
  pull_request:
    branches: [ testing-v2.0 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==================== Linux (只构建 Server + Extenders) ====================
  build-linux:
    name: Build Linux Server + Extenders
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement network.host

      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('**/Dockerfile*', '**/Makefile') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ hashFiles('**/Dockerfile*', '**/Makefile') }}-
            ${{ runner.os }}-buildx-

      - name: Build Server + Extenders
        run: make docker-build-server-ext

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: adaptix-linux-server
          path: AdaptixServer/server-dist/
          retention-days: 5

  # ==================== Windows Client ====================
  build-windows-client:
    name: Build Windows Client
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache MSYS2
        uses: actions/cache@v5
        with:
          path: C:/msys64
          key: msys2-mingw64-qt6-v1
          restore-keys: |
            msys2-mingw64-qt6-

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6
            mingw-w64-x86_64-qt6-tools

      - name: Build Client
        shell: msys2 {0}
        working-directory: AdaptixClient
        run: |
          export PATH="/mingw64/bin:$PATH"

          echo "[1/4] Build Release..."
          cmake -S . -B cmake-build-release -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build cmake-build-release --config Release

          echo "[2/4] Create dist..."
          rm -rf dist
          mkdir -p dist
          cp cmake-build-release/AdaptixClient.exe dist/

          echo "[3/4] windeployqt..."
          cd dist
          windeployqt.exe AdaptixClient.exe

          echo "[4/4] Add extra DLLs..."

          # 用 ntldd 自动扫描 exe 实际依赖的所有 mingw64 DLL
          pacman -S --noconfirm --needed mingw-w64-x86_64-ntldd 2>/dev/null || true
          if command -v ntldd &> /dev/null; then
            ntldd -R AdaptixClient.exe 2>/dev/null | \
              grep -i "mingw64" | \
              awk '{print $3}' | \
              sort -u | \
              while read -r dllpath; do
                [ -f "$dllpath" ] && cp -n "$dllpath" . || true
              done
          fi

          # 兜底列表
          cp /mingw64/bin/libwinpthread-1.dll . || true
          cp /mingw64/bin/libgcc_s_seh-1.dll . || true
          cp /mingw64/bin/libstdc++-6.dll . || true
          cp /mingw64/bin/libfreetype-6.dll . || true
          cp /mingw64/bin/libharfbuzz-0.dll . || true
          cp /mingw64/bin/libpng16-16.dll . || true
          cp /mingw64/bin/zlib1.dll . || true
          cp /mingw64/bin/libbrotlidec.dll . || true
          cp /mingw64/bin/libbrotlicommon.dll . || true
          cp /mingw64/bin/libbrotlienc.dll . || true
          cp /mingw64/bin/libpcre2-16-0.dll . || true
          cp /mingw64/bin/libpcre2-8-0.dll . || true
          cp /mingw64/bin/libintl-8.dll . || true
          cp /mingw64/bin/libiconv-2.dll . || true
          cp /mingw64/bin/libdouble-conversion.dll . || true
          cp /mingw64/bin/libmd4c.dll . || true
          cp /mingw64/bin/libb2-1.dll . || true
          cp /mingw64/bin/libicuin*.dll . || true
          cp /mingw64/bin/libicuuc*.dll . || true
          cp /mingw64/bin/libicudt*.dll . || true
          cp /mingw64/bin/libzstd.dll . || true
          cp /mingw64/bin/libbz2-1.dll . || true
          cp /mingw64/bin/libglib-2.0-0.dll . || true
          cp /mingw64/bin/liblzma-5.dll . || true
          cp /mingw64/bin/libssp-0.dll . || true

          echo "[OK] Complete!"
          ls -la

      - name: Upload Windows Client
        uses: actions/upload-artifact@v6
        with:
          name: adaptix-client-windows
          path: AdaptixClient/dist/
          retention-days: 5

  # ==================== macOS Client ====================
  build-macos-client:
    name: Build macOS Client (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Homebrew downloads
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-cache-qt6-${{ matrix.arch }}-v1
          restore-keys: |
            brew-cache-qt6-${{ matrix.arch }}-

      - name: Install dependencies
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install make cmake openssl qt@6

          echo "=== Qt@6 安装路径 ==="
          brew --prefix qt@6
          ls "$(brew --prefix qt@6)/lib/cmake/Qt6/" || true

      - name: Verify brew qt@6 detection
        run: |
          if ! brew --prefix qt@6 > /dev/null 2>&1; then
            echo "[ERROR] brew --prefix qt@6 检测失败，尝试重新 link"
            brew link --force qt@6 || brew link --overwrite qt@6
            brew --prefix qt@6
          fi

      - name: Build Client
        run: |
          export PATH="$(brew --prefix qt@6)/bin:$PATH"
          export CMAKE_PREFIX_PATH="$(brew --prefix qt@6)"

          # 强制指定架构
          export CMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}

          # 设置最低系统版本
          export MACOSX_DEPLOYMENT_TARGET=13.0

          echo "CMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH"
          echo "CMAKE_OSX_ARCHITECTURES=$CMAKE_OSX_ARCHITECTURES"
          echo "MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET"
          which qmake
          qmake --version || true

          make client-fast

          echo "[Deploy] 打包成 .app bundle + macdeployqt + 图标"

          ls -la dist/

          BUNDLE="dist/AdaptixClient.app"
          rm -rf "$BUNDLE"
          mkdir -p "$BUNDLE/Contents/MacOS"
          mkdir -p "$BUNDLE/Contents/Resources"

          # 复制可执行文件
          cp dist/AdaptixClient "$BUNDLE/Contents/MacOS/AdaptixClient"

          # ========== 生成并放入图标 ==========
          ICON_SRC="AdaptixClient/Resources/Logo.png"

          if [ ! -f "$ICON_SRC" ]; then
            echo "[ERROR] 找不到图标源文件: $ICON_SRC"
            exit 1
          fi

          mkdir -p AppIcon.iconset
          sips -z 16 16     "$ICON_SRC" --out AppIcon.iconset/icon_16x16.png
          sips -z 32 32     "$ICON_SRC" --out AppIcon.iconset/icon_16x16@2x.png
          sips -z 32 32     "$ICON_SRC" --out AppIcon.iconset/icon_32x32.png
          sips -z 64 64     "$ICON_SRC" --out AppIcon.iconset/icon_32x32@2x.png
          sips -z 128 128   "$ICON_SRC" --out AppIcon.iconset/icon_128x128.png
          sips -z 256 256   "$ICON_SRC" --out AppIcon.iconset/icon_128x128@2x.png
          sips -z 256 256   "$ICON_SRC" --out AppIcon.iconset/icon_256x256.png
          sips -z 512 512   "$ICON_SRC" --out AppIcon.iconset/icon_256x256@2x.png
          sips -z 512 512   "$ICON_SRC" --out AppIcon.iconset/icon_512x512.png
          sips -z 1024 1024 "$ICON_SRC" --out AppIcon.iconset/icon_512x512@2x.png

          iconutil -c icns AppIcon.iconset -o "$BUNDLE/Contents/Resources/AppIcon.icns"
          rm -rf AppIcon.iconset
          # ====================================

          # 写带图标的 Info.plist
          cat > "$BUNDLE/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>AdaptixClient</string>
              <key>CFBundleIdentifier</key>
              <string>com.adaptixframework.adaptixclient</string>
              <key>CFBundleName</key>
              <string>AdaptixClient</string>
              <key>CFBundleDisplayName</key>
              <string>AdaptixClient</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          # 部署 Qt 依赖
          macdeployqt "$BUNDLE" -always-overwrite

          # 最终输出
          mkdir -p dist-macos-${{ matrix.arch }}
          cp -r "$BUNDLE" dist-macos-${{ matrix.arch }}/
          ls -la dist-macos-${{ matrix.arch }}/
          ls -la dist-macos-${{ matrix.arch }}/AdaptixClient.app/Contents/Resources/

      - name: Verify architecture
        run: |
          echo "=== 检查架构 (${{ matrix.arch }}) ==="
          find dist-macos-${{ matrix.arch }} -type f -name "AdaptixClient" -exec file {} \;
          find dist-macos-${{ matrix.arch }} -type f -name "AdaptixClient" -exec lipo -info {} \; || true

          echo "=== 检查图标是否存在 ==="
          ls -la dist-macos-${{ matrix.arch }}/AdaptixClient.app/Contents/Resources/AppIcon.icns || echo "图标文件不存在！"

      - name: Package macOS app with ditto
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist-macos-${{ matrix.arch }}/AdaptixClient.app" \
            "dist-macos-${{ matrix.arch }}/AdaptixClient-macOS-${{ matrix.arch }}.zip"
          ls -lh "dist-macos-${{ matrix.arch }}/AdaptixClient-macOS-${{ matrix.arch }}.zip"

      - name: Upload macOS Client
        uses: actions/upload-artifact@v6
        with:
          name: adaptix-client-macos-${{ matrix.arch }}
          path: dist-macos-${{ matrix.arch }}/AdaptixClient-macOS-${{ matrix.arch }}.zip
          retention-days: 5

  # ==================== 自动创建 Release ====================
  release:
    name: Create Release
    needs: [build-linux, build-windows-client, build-macos-client]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package files
        run: |
          mkdir -p release

          if [ -d artifacts/adaptix-linux-server ]; then
            (cd artifacts/adaptix-linux-server && zip -r ../../release/AdaptixC2-Linux.zip .)
          fi

          if [ -d artifacts/adaptix-client-windows ]; then
            (cd artifacts/adaptix-client-windows && zip -r ../../release/AdaptixClient-Windows.zip .)
          fi

          # macOS 产物在 build 阶段已经用 ditto 打成了 zip（内含 .app），
          # 这里直接拷贝那个 zip，不要再对目录执行 zip -r，否则会变成“zip 套 zip”，
          if [ -d artifacts/adaptix-client-macos-arm64 ]; then
            cp artifacts/adaptix-client-macos-arm64/*.zip release/
          fi

          if [ -d artifacts/adaptix-client-macos-x86_64 ]; then
            cp artifacts/adaptix-client-macos-x86_64/*.zip release/
          fi

          ls -lh release/

      - name: Extract version from README
        id: version
        run: |
          # 读取 README 第一行，提取 vX.Y 或 vX.Y.Z
          VERSION=$(head -n 1 README.md | grep -oE 'v[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)

          if [ -z "$VERSION" ]; then
            echo "无法从 README 提取版本号，使用 fallback"
            VERSION="build-${{ github.run_number }}"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "提取到的版本号: $VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: AdaptixC2 ${{ steps.version.outputs.version }}
          body: |
            自动构建产物（已启用缓存）

            - **Linux**: Server + Extenders
            - **Windows**: Client
            - **macOS**: Client (ARM64 + x86_64)
          files: release/*.zip
          draft: false
          prerelease: true
