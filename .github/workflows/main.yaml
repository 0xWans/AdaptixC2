name: Build AdaptixC2

on:
  push:
    branches: [ testing-v2.0 ]
  pull_request:
    branches: [ testing-v2.0 ]
  workflow_dispatch:          # 仍然支持手动触发

permissions:
  contents: write

jobs:
  # ==================== Linux ====================
  build-linux:
    name: Build Linux (Server + Extenders + Client)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Server + Extenders
        run: |
          make docker-build-server-ext

      - name: Build Client
        run: |
          make docker-build-client

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: adaptix-linux
          path: |
            AdaptixServer/server-dist/
            AdaptixClient/client-dist/
          retention-days: 5

  # ==================== Windows Client ====================
  build-windows-client:
    name: Build Windows Client
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache MSYS2
        uses: actions/cache@v4
        with:
          path: C:/msys64
          key: msys2-mingw64-qt6-${{ hashFiles('.github/workflows/build-adaptixc2.yml') }}
          restore-keys: |
            msys2-mingw64-qt6-

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6
            mingw-w64-x86_64-qt6-tools
          # 如果已经有缓存，这个步骤会快很多

      - name: Build Client
        shell: msys2 {0}
        working-directory: AdaptixClient
        run: |
          export PATH="/mingw64/bin:$PATH"
          
          echo "[1/4] Build Release..."
          cmake -S . -B cmake-build-release -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build cmake-build-release --config Release
          
          echo "[2/4] Create dist..."
          rm -rf dist
          mkdir -p dist
          cp cmake-build-release/AdaptixClient.exe dist/
          
          echo "[3/4] windeployqt..."
          cd dist
          windeployqt.exe AdaptixClient.exe
          
          echo "[4/4] Add extra DLLs..."
          cp /mingw64/bin/libwinpthread-1.dll . || true
          cp /mingw64/bin/libgcc_s_seh-1.dll . || true
          cp /mingw64/bin/libstdc++-6.dll . || true
          cp /mingw64/bin/libfreetype-6.dll . || true
          cp /mingw64/bin/libharfbuzz-0.dll . || true
          cp /mingw64/bin/libpng16-16.dll . || true
          cp /mingw64/bin/zlib1.dll . || true
          cp /mingw64/bin/libpcre2-16-0.dll . || true
          cp /mingw64/bin/libpcre2-8-0.dll . || true
          cp /mingw64/bin/libintl-8.dll . || true
          cp /mingw64/bin/libiconv-2.dll . || true
          cp /mingw64/bin/libicuin*.dll . || true
          cp /mingw64/bin/libicuuc*.dll . || true
          cp /mingw64/bin/libicudt*.dll . || true
          
          echo "[OK] Complete!"

      - name: Upload Windows Client
        uses: actions/upload-artifact@v4
        with:
          name: adaptix-client-windows
          path: AdaptixClient/dist/
          retention-days: 5

  # ==================== macOS Client ====================
  build-macos-client:
    name: Build macOS Client (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Cellar
            /opt/homebrew/Cellar
          key: homebrew-qt6-${{ matrix.arch }}-${{ hashFiles('.github/workflows/build-adaptixc2.yml') }}
          restore-keys: |
            homebrew-qt6-${{ matrix.arch }}-

      - name: Install dependencies
        run: |
          brew update
          brew install make cmake openssl qt@6 || true
          # 如果缓存命中，安装会很快

      - name: Build Client
        run: |
          export PATH="$(brew --prefix qt@6)/bin:$PATH"
          export CMAKE_PREFIX_PATH="$(brew --prefix qt@6)"
          
          make client-fast
          
          mkdir -p dist-macos-${{ matrix.arch }}
          cp -r dist/* dist-macos-${{ matrix.arch }}/ 2>/dev/null || true
          cp -r AdaptixClient/AdaptixClient.app dist-macos-${{ matrix.arch }}/ 2>/dev/null || true

      - name: Upload macOS Client
        uses: actions/upload-artifact@v4
        with:
          name: adaptix-client-macos-${{ matrix.arch }}
          path: dist-macos-${{ matrix.arch }}/
          retention-days: 5

  # ==================== 自动创建 Release ====================
  release:
    name: Create Release
    needs: [build-linux, build-windows-client, build-macos-client]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package files
        run: |
          mkdir -p release

          if [ -d artifacts/adaptix-linux ]; then
            (cd artifacts/adaptix-linux && zip -r ../../release/AdaptixC2-Linux.zip .)
          fi

          if [ -d artifacts/adaptix-client-windows ]; then
            (cd artifacts/adaptix-client-windows && zip -r ../../release/AdaptixClient-Windows.zip .)
          fi

          if [ -d artifacts/adaptix-client-macos-arm64 ]; then
            (cd artifacts/adaptix-client-macos-arm64 && zip -r ../../release/AdaptixClient-macOS-arm64.zip .)
          fi

          if [ -d artifacts/adaptix-client-macos-x86_64 ]; then
            (cd artifacts/adaptix-client-macos-x86_64 && zip -r ../../release/AdaptixClient-macOS-x86_64.zip .)
          fi

          ls -lh release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AdaptixC2 Build #${{ github.run_number }}
          body: |
            自动构建产物（已启用缓存）
            
            - **Linux**: Server + Extenders + Client
            - **Windows**: Client
            - **macOS**: Client (ARM64 + x86_64)
          files: release/*.zip
          draft: false
          prerelease: true
